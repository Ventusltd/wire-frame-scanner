name: geometry-audit
# The geometry CI audit (audit/geometry_audit.py) against the simulator's main: NumPy on hosted CI for every push and
# once a day; the CuPy path runs on the self-hosted GPU runner when it is started (workflow_dispatch, gpu: true).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      gpu:
        description: 'Run on the self-hosted GPU runner (CuPy)'
        type: boolean
        default: false
jobs:
  audit:
    runs-on: ${{ inputs.gpu && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Ventusltd/energy-transition-simulator
          path: sim
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        if: ${{ !inputs.gpu }}
        with:
          python-version: '3.12'
      - run: python -m pip install numpy
        if: ${{ !inputs.gpu }}
      - run: python audit/geometry_audit.py --repo sim --out audit-out
      - uses: actions/upload-artifact@v4
        with:
          name: geometry-audit
          path: audit-out
